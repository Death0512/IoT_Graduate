<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Graduate — Central Monitor</title>
<!-- SERVER_CONFIG -->
<style>
:root {
  --video-aspect-ratio: 16/9;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  color: #e0e0e0;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden;
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
}

/* ── Toolbar ───────────────────────────────────────────── */
#toolbar {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 16px;
  background: #1a1a24;
  border-bottom: 1px solid #2a2a3a;
  position: relative; z-index: 100;
}
#toolbar h1 { font-size: 16px; font-weight: 600; color: #7c7cff; white-space: nowrap; }

#cluster-nav { display: flex; align-items: center; gap: 6px; }
#cluster-nav button {
  background: #2a2a3a; border: none; color: #ccc;
  font-size: 14px; padding: 2px 8px; border-radius: 4px;
  cursor: pointer; line-height: 1.4;
}
#cluster-nav button:hover { background: #3a3a4a; }
#cluster-nav button:disabled { opacity: 0.3; cursor: default; }
#cluster-title { font-size: 13px; font-weight: 500; color: #e0e0e0; min-width: 80px; text-align: center; }

.badge { font-size: 11px; padding: 2px 10px; border-radius: 10px; background: #2a2a3a; white-space: nowrap; }
.badge.online { color: #4caf50; background: #1a3a1a; }
.badge.offline { color: #f44336; background: #3a1a1a; }
#status { font-size: 11px; color: #888; margin-left: auto; white-space: nowrap; }
#status.online { color: #4caf50; }
#status.error { color: #f44336; }

/* ── Main layout ──────────────────────────────────────── */
#main {
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 8px;
  padding: 8px;
  overflow: hidden;
  min-height: 0;
}

/* ── Video panel ──────────────────────────────────────── */
#video-panel {
  background: #14141e;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}
#video-grid {
  flex: 1;
  display: grid;
  gap: 6px;
  padding: 8px;
  min-height: 0;
}
.video-cell {
  background: #000;
  border: 1px solid #1a1a28;
  border-radius: 6px;
  overflow: hidden;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: var(--video-aspect-ratio);
  min-height: 0;
  min-width: 0;
}
.video-cell.offline {
  background: #0a0a10;
  border-color: #222233;
}
.video-cell video {
  width: 100%; height: 100%;
  object-fit: contain;
  background: #000;
}
.video-cell .label {
  position: absolute; top: 6px; left: 8px;
  font-size: 11px; font-weight: 600;
  color: #fff; background: rgba(0,0,0,0.7);
  padding: 2px 8px; border-radius: 4px;
  z-index: 2;
  display: flex; align-items: center; gap: 6px;
  backdrop-filter: blur(2px);
}
.video-cell .label .node-badge {
  font-size: 9px;
  background: #7c7cff;
  color: #0a0a0f;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 3px;
  letter-spacing: 0.5px;
}
.video-cell .stats-overlay {
  position: absolute; bottom: 6px; left: 8px;
  font-size: 10px; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  color: #00e676; background: rgba(0,0,0,0.75);
  padding: 2px 7px; border-radius: 4px;
  z-index: 2;
  letter-spacing: 0.3px;
  backdrop-filter: blur(2px);
}
.video-cell.offline .stats-overlay {
  color: #777;
}
.video-cell .status-badge {
  position: absolute; bottom: 6px; right: 8px;
  font-size: 10px; padding: 1px 6px; border-radius: 3px;
  z-index: 2;
  font-weight: 500;
}
.video-cell .status-badge.connecting { background: #ff9800; color: #000; }
.video-cell .status-badge.live { background: #4caf50; color: #fff; }
.video-cell .status-badge.error { background: #f44336; color: #fff; }
.video-cell .status-badge.offline { background: #3a3a4a; color: #aaa; }
.video-cell .bitrate-badge {
  position: absolute; top: 6px; right: 8px;
  font-size: 10px; color: #aaa; background: rgba(0,0,0,0.65);
  padding: 1px 6px; border-radius: 3px;
  z-index: 2;
}
.video-cell .offline-placeholder {
  color: #555;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  text-align: center;
}
.video-cell .no-stream {
  color: #555; font-size: 13px;
}

/* ── Cluster dots ─────────────────────────────────────── */
#cluster-dots {
  display: flex; justify-content: center; gap: 6px;
  padding: 6px 0 8px;
}
#cluster-dots .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #3a3a4a; cursor: pointer;
  transition: background 0.2s;
}
#cluster-dots .dot.active { background: #7c7cff; }
#cluster-dots .dot:hover { background: #5a5a6a; }

/* ── Sidebar ──────────────────────────────────────────── */
#sidebar {
  display: flex; flex-direction: column; gap: 6px;
  overflow-y: auto;
  min-height: 0;
}
#sidebar::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 2px; }

.health-card {
  background: #1a1a28;
  border-radius: 6px;
  padding: 10px 12px;
  border-left: 3px solid #4caf50;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.health-card.offline { border-left-color: #555; opacity: 0.65; }
.health-card.degraded { border-left-color: #f44336; }

.health-card .header {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 2px;
}
.health-card .status-indicator {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.health-card .status-indicator.online { background: #4caf50; }
.health-card .status-indicator.offline { background: #555; }
.health-card .status-indicator.degraded { background: #f44336; }

.health-card .node-badge {
  font-size: 10px; font-weight: 700;
  padding: 1px 5px; border-radius: 3px;
  background: #2a2a3a; color: #7c7cff;
}
.health-card .node-id { font-weight: 600; font-size: 12px; color: #e0e0e0; }
.health-card .btn-copy-ip {
  background: transparent; border: none; cursor: pointer;
  font-size: 11px; padding: 1px 3px; color: #888;
  border-radius: 3px; line-height: 1;
}
.health-card .btn-copy-ip:hover { background: #2a2a3a; color: #fff; }
.health-card .status-pill {
  font-size: 9px; font-weight: 600;
  padding: 1px 6px; border-radius: 8px;
  margin-left: auto; text-transform: uppercase;
}
.health-card .status-pill.online { background: #1a3a1a; color: #4caf50; }
.health-card .status-pill.offline { background: #2a2a2a; color: #888; }
.health-card .status-pill.degraded { background: #3a1a1a; color: #f44336; }

.health-card .ip-row {
  display: flex; gap: 4px; font-size: 10px; color: #888;
  margin-bottom: 2px;
}
.health-card .ip-value { color: #aaa; font-family: monospace; }

.metric-row {
  display: flex; align-items: center; gap: 6px;
  margin-top: 2px;
  font-size: 11px;
}
.metric-row .metric-label { color: #aaa; min-width: 28px; text-align: right; font-size: 10px; }
.metric-bar {
  flex: 1; height: 6px; background: #2a2a3a; border-radius: 3px;
  overflow: hidden;
}
.metric-bar .bar-fill {
  height: 100%; border-radius: 3px;
  transition: width 0.4s ease;
  background: #4caf50;
}
.metric-bar .bar-fill.warn { background: #ff9800; }
.metric-bar .bar-fill.crit { background: #f44336; }
.metric-row .metric-value { min-width: 36px; text-align: right; font-size: 10px; color: #e0e0e0; }

.stats-meta-row {
  display: flex; justify-content: space-between; gap: 4px;
  margin-top: 3px; padding-top: 3px;
  border-top: 1px solid #222232;
  font-size: 10px; color: #888;
}
.stats-meta-row .meta-item { display: flex; gap: 3px; align-items: center; }
.stats-meta-row .meta-label { color: #888; }
.stats-meta-row .meta-value { color: #e0e0e0; font-weight: 500; }

.active-cams-row {
  display: flex; flex-wrap: wrap; gap: 4px;
  margin-top: 4px;
}
.cam-badge {
  font-size: 9px; font-weight: 600;
  padding: 1px 6px; border-radius: 3px;
  background: #252538; color: #4fc3f7;
  border: 1px solid #35354a;
}
.cam-badge.none {
  color: #666; background: transparent; border: none;
  font-style: italic;
}

/* ── Modal ────────────────────────────────────────────── */
#modal-overlay {
  display: none;
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  z-index: 1000;
  justify-content: center; align-items: center;
}
#modal-overlay.open { display: flex; }
#modal-overlay img {
  max-width: 90vw; max-height: 90vh;
  border-radius: 8px;
}
#modal-overlay .close {
  position: absolute; top: 20px; right: 30px;
  font-size: 28px; color: #fff; cursor: pointer;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0a0a0f; }
::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 3px; }
</style>
</head>
<body>

<div id="toolbar">
  <h1>Central Monitor</h1>
  <div id="cluster-nav">
    <button id="prev-cluster" disabled>&larr;</button>
    <span id="cluster-title">Cluster</span>
    <button id="next-cluster" disabled>&rarr;</button>
  </div>
  <span class="badge" id="edge-count-badge">0 edges</span>
  <span class="badge" id="stream-count-badge" style="color:#4fc3f7;background:#1a2a3a;">0 cameras</span>
  <span id="status">Connecting...</span>
</div>

<div id="main">
  <div id="video-panel">
    <div id="video-grid">
      <div class="video-cell offline"><span class="no-stream">No cameras available</span></div>
    </div>
    <div id="cluster-dots"></div>
  </div>
  <div id="sidebar"></div>
</div>

<div id="modal-overlay" onclick="this.classList.remove('open')">
  <span class="close">&times;</span>
  <img id="modal-img" src="" alt="snapshot">
</div>

<script>
(function () {

// ── Config ────────────────────────────────────────────────────
const CONFIG = (() => {
  try {
    const el = document.getElementById('server-config');
    if (el) return JSON.parse(el.textContent);
  } catch(e) {}
  return {
    MEDIAMTX_API: '/api/streams',
    MEDIAMTX_WEBRTC_URL: `http://${location.hostname}:8889`,
    WS_URL: `ws://${location.host}/ws/server`,
  };
})();

const MEDIAMTX_WEBRTC_BASE = CONFIG.MEDIAMTX_WEBRTC_URL || `http://${location.hostname}:8889`;
const WS_URL = CONFIG.WS_URL || `ws://${location.host}/ws/server`;

// ── DOM refs ─────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const TOOLBAR = $('toolbar');
const CLUSTER_TITLE = $('cluster-title');
const PREV_BTN = $('prev-cluster');
const NEXT_BTN = $('next-cluster');
const CLUSTER_DOTS = $('cluster-dots');
const EDGE_BADGE = $('edge-count-badge');
const STREAM_BADGE = $('stream-count-badge');
const STATUS = $('status');
const VIDEO_GRID = $('video-grid');
const SIDEBAR = $('sidebar');
const MODAL = $('modal-overlay');
const MODAL_IMG = $('modal-img');

// ── State ────────────────────────────────────────────────────
const edges = {};                // node_id -> edge dict (from server)
const streamStates = {};         // camId -> { pc, mediaStream, video, cell, streamPath, connecting, reconnectTimer, statsTimer, bitrate, connected }
const allKnownCameras = new Map(); // camId -> { camera_id, source_id, node_id, node_ip, stream_path }
const authoritativeCameras = new Map(); // camId -> server projection row (one per camera_id)
let cameraPollTimer = null;

let clusters = [];               // [{ id, edges: [...] }]
let mediaMtxStreamNames = [];    // stream names from MediaMTX (pollStreams)
let currentClusterIdx = 0;
let streamPollTimer = null;
let ws = null;
let reconnectTimer = null;
let wsPingTimer = null;

// ── Format helpers ──────────────────────────────────────────
function fmtPct(v) { return v != null ? `${v.toFixed(1)}%` : '--'; }
function fmtTemp(v) { return v != null ? `${v.toFixed(1)}\u00B0C` : '--'; }
function fmtGpuPct(v, source) {
  if (source === 'jtop_unavailable') return 'N/A';
  return v != null ? `${v.toFixed(1)}%` : '--';
}
function fmtGpuTemp(v, source) {
  if (source === 'jtop_unavailable') return 'N/A';
  return v != null ? `${v.toFixed(1)}\u00B0C` : '--';
}
function fmtBitrate(bps) {
  if (!bps || bps <= 0) return '';
  if (bps > 1e6) return `${(bps / 1e6).toFixed(1)} Mbps`;
  return `${Math.round(bps / 1000)} kbps`;
}
function escAttr(s) {
  if (typeof s !== 'string') s = String(s || '');
  return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escHtml(s) {
  if (typeof s !== 'string') s = String(s || '');
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function getNodeBadge(nodeId) {
  if (!nodeId) return '?';
  const m = String(nodeId).match(/^(?:jetson|edge|node)[_-]?([a-zA-Z0-9]+)$/i);
  return m ? m[1].toUpperCase() : String(nodeId).slice(0, 3).toUpperCase();
}

// ── Camera list construction ────────────────────────────────
function buildCameraList(data) {
  let cams = [];
  let nodes = {};
  if (data && data.nodes) {
    nodes = data.nodes;
  } else if (data && data.edges) {
    nodes = Array.isArray(data.edges)
      ? Object.fromEntries(data.edges.map(e => [e.node_id, e]))
      : data.edges;
  } else if (data && typeof data === 'object' && Object.keys(data).length > 0 && !data.type) {
    nodes = data;
  } else {
    nodes = edges;
  }

  const activeSeen = new Set();
  const knownActiveNodes = new Set();

  const camOwner = {};
  for (const n of Object.values(nodes || {})) {
    const pl = n.pipeline || (n.health && n.health.pipeline) || {};
    const owners = pl.camera_owners || (n.health && n.health.camera_owners) || {};
    for (const [cid, owner] of Object.entries(owners)) {
      if (owner) camOwner[cid] = owner;
    }
  }
  const ownerOf = (camId, runningNode) => {
    if (camOwner[camId]) return camOwner[camId];
    // Fallback based on camera number matching node_camera_map
    const m = String(camId).match(/(\d+)/);
    const n = m ? parseInt(m[1], 10) : 0;
    if (n >= 1 && n <= 2) return 'jetson_A';
    if (n >= 3 && n <= 4) return 'jetson_B';
    if (n >= 5 && n <= 6) return 'jetson_C';
    return runningNode;
  };

  for (const node of Object.values(nodes || {})) {
    const isOnline = node.online !== false;
    const pipeline = node.pipeline || (node.health && node.health.pipeline);
    if (!pipeline) continue;
    if (isOnline) {
      knownActiveNodes.add(node.node_id);
    }

    const nodeIp = node.advertise_ip || node.ip || (node.health && node.health.advertise_ip) || '';
    const fpsPerCam = pipeline.fps_per_camera || {};
    const camFeats = pipeline.camera_features || {};

    if (pipeline.camera_configs) {
      for (const [camId, cfg] of Object.entries(pipeline.camera_configs)) {
        let sourceId = cfg && typeof cfg.source_id === 'number' ? cfg.source_id : null;
        if (sourceId === null) {
          const parts = String(camId).split('_');
          const num = parts.length > 1 ? parseInt(parts[1], 10) : parseInt(camId.replace(/\D/g, ''), 10);
          sourceId = !isNaN(num) ? num - 1 : 0;
        }
        allKnownCameras.set(camId, {
          camera_id: camId,
          source_id: sourceId,
          node_id: node.node_id,
          node_ip: nodeIp,
          stream_path: `${ownerOf(camId, node.node_id)}/${camId}`,
        });
      }
    }

    if (!pipeline.active_cameras) continue;

    for (const camId of pipeline.active_cameras) {
      activeSeen.add(camId);
      const cfg = pipeline.camera_configs ? pipeline.camera_configs[camId] : null;
      let sourceId = cfg && typeof cfg.source_id === 'number' ? cfg.source_id : null;
      if (sourceId === null) {
        const parts = String(camId).split('_');
        const num = parts.length > 1 ? parseInt(parts[1], 10) : parseInt(camId.replace(/\D/g, ''), 10);
        sourceId = !isNaN(num) ? num - 1 : 0;
      }
      const feat = camFeats[camId] || {};

      cams.push({
        camera_id: camId,
        source_id: sourceId,
        node_id: node.node_id,
        node_ip: nodeIp,
        stream_path: `${ownerOf(camId, node.node_id)}/${camId}`,
        fps: fpsPerCam[camId] || 0,
        n_track: feat.n_track || 0,
        n_plate: feat.n_plate || 0,
        online: isOnline,
      });
    }
  }

  // Preserve offline camera cells in global source_id order
  for (const [camId, prev] of allKnownCameras.entries()) {
    if (!activeSeen.has(camId)) {
      // Conservative handling: prune stale camera entry if its registered edge node is gone or has no cameras
      if (prev.node_id && nodes[prev.node_id] === undefined && edges[prev.node_id] === undefined) {
        allKnownCameras.delete(camId);
        continue;
      }
      cams.push({
        ...prev,
        fps: 0,
        n_track: 0,
        n_plate: 0,
        online: false,
      });
    }
  }

  // Update known cameras cache
  for (const cam of cams) {
    allKnownCameras.set(cam.camera_id, {
      camera_id: cam.camera_id,
      source_id: cam.source_id,
      node_id: cam.node_id,
      node_ip: cam.node_ip,
      stream_path: cam.stream_path,
    });
  }

  // Deduplicate to exactly one row per camera using the server's authoritative
  // projection: when two nodes both report the same camera_id (e.g. a stale
  // peer or a takeover in flight), keep only the authoritative holder's entry
  // instead of unioning duplicates into the grid.
  if (authoritativeCameras.size > 0) {
    const byId = new Map();
    for (const cam of cams) {
      const auth = authoritativeCameras.get(cam.camera_id);
      const holder = auth && (auth.holder_node || auth.node_id);
      const existing = byId.get(cam.camera_id);
      if (!existing) {
        byId.set(cam.camera_id, cam);
      } else if (holder && cam.node_id === holder) {
        byId.set(cam.camera_id, cam); // authoritative holder wins
      } else if (holder && existing.node_id !== holder && cam.online) {
        byId.set(cam.camera_id, cam); // prefer an online non-stale copy
      }
    }
    cams = Array.from(byId.values());
  }

  return cams.sort((a, b) => a.source_id - b.source_id);
}

// ── Cluster grouping ────────────────────────────────────────
function getClusterId(edge) {
  if (edge.cluster_id && edge.cluster_id !== 'default') return edge.cluster_id;
  const ip = edge.ip || '';
  const parts = ip.split('.');
  if (parts.length >= 3) return parts.slice(0, 3).join('.');
  return 'default';
}

function rebuildClusters() {
  const groups = {};
  for (const edge of Object.values(edges)) {
    const cid = getClusterId(edge);
    if (!groups[cid]) groups[cid] = [];
    groups[cid].push(edge);
  }
  const keys = Object.keys(groups).sort();
  clusters = keys.map((id) => ({ id: id === 'default' ? 'cluster' : `Cluster ${keys.indexOf(id) + 1}`, displayId: id, edges: groups[id] }));
  if (currentClusterIdx >= clusters.length) currentClusterIdx = Math.max(0, clusters.length - 1);
}

function getCurrentCluster() {
  return clusters[currentClusterIdx] || null;
}

// ── Grid layout computation ─────────────────────────────────
function computeGridLayout(n) {
  if (n <= 1) return { cols: 1, rows: 1 };
  if (n === 2) return { cols: 2, rows: 1 };
  if (n <= 4) return { cols: 2, rows: 2 };
  if (n <= 6) return { cols: 3, rows: 2 };
  if (n <= 9) return { cols: 3, rows: 3 };
  return { cols: 4, rows: Math.ceil(n / 4) };
}

// ── WHEP Player ─────────────────────────────────────────────
async function startWhepPlayer(streamPath, videoEl, onStats) {
  const whepUrl = `${MEDIAMTX_WEBRTC_BASE}/${streamPath}/whep`;
  let pc;
  try {
    pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });
  } catch(e) {
    return null;
  }

  pc.addTransceiver('video', { direction: 'recvonly' });

  pc.ontrack = (evt) => {
    if (evt.track.kind === 'video') {
      const stream = evt.streams[0] || null;
      for (const [cid, st] of Object.entries(streamStates)) {
        if (st && st.pc === pc) {
          st.mediaStream = stream;
          if (st.video && stream) {
            st.video.srcObject = stream;
          }
          break;
        }
      }
      if (videoEl && stream) {
        videoEl.srcObject = stream;
      }
      const cell = videoEl ? videoEl.parentElement : null;
      if (cell && !cell.classList.contains('offline')) {
        const badge = cell.querySelector('.status-badge');
        if (badge) { badge.className = 'status-badge live'; badge.textContent = 'Live'; }
      }
    }
  };

  let offer;
  try {
    offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
  } catch(e) {
    pc.close();
    return null;
  }

  try {
    const resp = await fetch(whepUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/sdp' },
      body: pc.localDescription.sdp,
    });
    if (!resp.ok) {
      pc.close();
      return null;
    }
    const answerSdp = await resp.text();
    await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
  } catch(e) {
    pc.close();
    return null;
  }

  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === 'failed' || s === 'disconnected') {
      for (const [cid, st] of Object.entries(streamStates)) {
        if (st && st.pc === pc) {
          scheduleStreamReconnect(cid);
          break;
        }
      }
    }
  };

  if (onStats) {
    const interval = setInterval(async () => {
      try {
        if (pc.connectionState !== 'connected') return;
        const stats = await pc.getStats();
        let bitrate = 0;
        stats.forEach((report) => {
          if (report.type === 'inbound-rtp' && report.kind === 'video' && report.bytesReceived) {
            if (pc._lastBytes && pc._lastTime) {
              const dt = (report.timestamp - pc._lastTime) / 1000;
              if (dt > 0) {
                bitrate = 8 * (report.bytesReceived - pc._lastBytes) / dt;
              }
            }
            pc._lastBytes = report.bytesReceived;
            pc._lastTime = report.timestamp;
          }
        });
        for (const st of Object.values(streamStates)) {
          if (st.pc === pc) {
            st.bitrate = bitrate;
            break;
          }
        }
        if (onStats) onStats(bitrate);
      } catch(e) {}
    }, 2000);
    pc._statsInterval = interval;
  }

  return pc;
}

function cleanupStream(camId) {
  const st = streamStates[camId];
  if (!st) return;
  if (st.reconnectTimer) { clearTimeout(st.reconnectTimer); st.reconnectTimer = null; }
  if (st.pc) {
    if (st.pc._statsInterval) clearInterval(st.pc._statsInterval);
    st.pc.onconnectionstatechange = null;
    st.pc.close();
    st.pc = null;
  }
  if (st.video) {
    st.video.srcObject = null;
  }
  st.mediaStream = null;
  st.connecting = false;
  st.connected = false;
}

function scheduleStreamReconnect(camId) {
  const st = streamStates[camId];
  if (!st) return;
  cleanupStream(camId);
  st.reconnectTimer = setTimeout(() => {
    st.reconnectTimer = null;
    if (streamStates[camId] && !streamStates[camId].pc) {
      streamStates[camId].connecting = false;
      tryConnectStream(camId);
    }
  }, 3000);
}

async function tryConnectStream(camId) {
  const st = streamStates[camId];
  if (!st || !st.video || st.connecting || !st.streamPath) return;
  st.connecting = true;
  if (st.cell && !st.cell.classList.contains('offline')) {
    const badge = st.cell.querySelector('.status-badge');
    if (badge) { badge.textContent = 'Connecting...'; badge.className = 'status-badge connecting'; }
  }
  const pc = await startWhepPlayer(st.streamPath, st.video, (bitrate) => {
    const cell = streamStates[camId] && streamStates[camId].cell;
    if (cell) {
      const el = cell.querySelector('.bitrate-badge');
      if (el) el.textContent = fmtBitrate(bitrate);
    }
  });
  st.connecting = false;
  if (pc) {
    st.pc = pc;
    st.connected = true;
    if (st.cell && !st.cell.classList.contains('offline')) {
      const badge = st.cell.querySelector('.status-badge');
      if (badge) { badge.textContent = 'Live'; badge.className = 'status-badge live'; }
    }
  } else {
    if (st.cell && !st.cell.classList.contains('offline')) {
      const badge = st.cell.querySelector('.status-badge');
      if (badge) { badge.textContent = 'Error'; badge.className = 'status-badge error'; }
    }
    scheduleStreamReconnect(camId);
  }
}

// ── Render: Video grid ──────────────────────────────────────
function formatStatsOverlay(cam) {
  if (!cam.online) return 'OFFLINE';
  const fps = typeof cam.fps === 'number' ? cam.fps.toFixed(1) : parseFloat(cam.fps || 0).toFixed(1);
  const nTrack = typeof cam.n_track === 'number' ? cam.n_track.toFixed(1) : parseFloat(cam.n_track || 0).toFixed(1);
  const nPlate = typeof cam.n_plate === 'number' ? cam.n_plate.toFixed(1) : parseFloat(cam.n_plate || 0).toFixed(1);
  return `FPS: ${fps} | N: ${nTrack} | P: ${nPlate}`;
}

function createVideoCell(cam) {
  const cell = document.createElement('div');
  cell.className = `video-cell ${cam.online ? '' : 'offline'}`;
  cell.dataset.camId = cam.camera_id;
  cell.dataset.streamPath = cam.stream_path;

  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;
  video.muted = true;
  if (!cam.online) video.style.display = 'none';
  cell.appendChild(video);

  const label = document.createElement('div');
  label.className = 'label';
  label.innerHTML = `
    <span class="cam-name">${escHtml(cam.camera_id)}</span>
    <span class="node-badge" title="Node: ${escAttr(cam.node_id)}">${escHtml(getNodeBadge(cam.node_id))}</span>
  `;
  cell.appendChild(label);

  const statsOverlay = document.createElement('div');
  statsOverlay.className = 'stats-overlay';
  statsOverlay.textContent = formatStatsOverlay(cam);
  cell.appendChild(statsOverlay);

  const bitrateBadge = document.createElement('div');
  bitrateBadge.className = 'bitrate-badge';
  cell.appendChild(bitrateBadge);

  const statusBadge = document.createElement('div');
  statusBadge.className = `status-badge ${cam.online ? 'connecting' : 'offline'}`;
  statusBadge.textContent = cam.online ? 'Connecting...' : 'Offline';
  cell.appendChild(statusBadge);

  const offlineMsg = document.createElement('div');
  offlineMsg.className = 'offline-placeholder';
  offlineMsg.textContent = 'OFFLINE';
  offlineMsg.style.display = cam.online ? 'none' : 'block';
  cell.appendChild(offlineMsg);

  if (streamStates[cam.camera_id]) {
    streamStates[cam.camera_id].video = video;
    streamStates[cam.camera_id].cell = cell;
  }

  return cell;
}

function updateVideoCell(cell, cam) {
  cell.dataset.streamPath = cam.stream_path;
  const isOffline = !cam.online;
  cell.classList.toggle('offline', isOffline);

  const video = cell.querySelector('video');
  if (video) {
    video.style.display = isOffline ? 'none' : 'block';
    if (isOffline) {
      video.srcObject = null;
    }
  }

  const offlineMsg = cell.querySelector('.offline-placeholder');
  if (offlineMsg) offlineMsg.style.display = isOffline ? 'block' : 'none';

  const camNameEl = cell.querySelector('.cam-name');
  if (camNameEl) camNameEl.textContent = cam.camera_id;

  const nodeBadgeEl = cell.querySelector('.node-badge');
  if (nodeBadgeEl) {
    nodeBadgeEl.textContent = getNodeBadge(cam.node_id);
    nodeBadgeEl.title = `Node: ${cam.node_id}`;
  }

  const statsEl = cell.querySelector('.stats-overlay');
  if (statsEl) statsEl.textContent = formatStatsOverlay(cam);

  const statusBadge = cell.querySelector('.status-badge');
  if (statusBadge) {
    if (isOffline) {
      statusBadge.className = 'status-badge offline';
      statusBadge.textContent = 'Offline';
    } else if (!streamStates[cam.camera_id]?.connected) {
      statusBadge.className = 'status-badge connecting';
      statusBadge.textContent = 'Connecting...';
    } else {
      statusBadge.className = 'status-badge live';
      statusBadge.textContent = 'Live';
    }
  }
}

function renderVideoGrid(data) {
  const cluster = getCurrentCluster();
  let clusterData = data;
  if (!clusterData && cluster) {
    clusterData = { edges: cluster.edges };
  }
  const cams = buildCameraList(clusterData);
  const n = cams.length;

  STREAM_BADGE.textContent = `${n} cameras`;

  if (n === 0) {
    const oldVideos = VIDEO_GRID.querySelectorAll('video');
    for (const v of oldVideos) {
      v.srcObject = null;
    }
    VIDEO_GRID.innerHTML = '<div class="video-cell offline"><span class="no-stream">No cameras available</span></div>';
    for (const camId of Object.keys(streamStates)) {
      cleanupStream(camId);
      delete streamStates[camId];
    }
    return;
  }

  const layout = computeGridLayout(n);
  VIDEO_GRID.style.gridTemplateColumns = `repeat(${layout.cols}, 1fr)`;
  VIDEO_GRID.style.gridTemplateRows = `repeat(${layout.rows}, 1fr)`;

  const currentCamIds = new Set(cams.map(c => c.camera_id));
  for (const camId of Object.keys(streamStates)) {
    if (!currentCamIds.has(camId)) {
      cleanupStream(camId);
      delete streamStates[camId];
    }
  }

  const existingCells = Array.from(VIDEO_GRID.querySelectorAll('.video-cell[data-cam-id]'));
  const existingCamIds = existingCells.map(el => el.dataset.camId);
  const needsRebuild = existingCamIds.length !== cams.length ||
    cams.some((c, i) => c.camera_id !== existingCamIds[i]);

  if (needsRebuild) {
    const oldVideos = VIDEO_GRID.querySelectorAll('video');
    for (const v of oldVideos) {
      v.srcObject = null;
    }
    VIDEO_GRID.innerHTML = '';
    for (const cam of cams) {
      const cell = createVideoCell(cam);
      VIDEO_GRID.appendChild(cell);
      const newVideo = cell.querySelector('video');
      if (!streamStates[cam.camera_id]) {
        streamStates[cam.camera_id] = {
          pc: null,
          mediaStream: null,
          video: newVideo,
          cell: cell,
          streamPath: cam.stream_path,
          connecting: false,
          reconnectTimer: null,
          statsTimer: null,
          bitrate: 0,
          connected: false
        };
      } else {
        const st = streamStates[cam.camera_id];
        st.video = newVideo;
        st.cell = cell;
        if (st.mediaStream && newVideo && cam.online) {
          newVideo.srcObject = st.mediaStream;
        }
      }
    }
  } else {
    for (const cam of cams) {
      const cell = VIDEO_GRID.querySelector(`.video-cell[data-cam-id="${cam.camera_id}"]`);
      if (cell) {
        updateVideoCell(cell, cam);
        const st = streamStates[cam.camera_id];
        if (st && st.mediaStream && cam.online) {
          const video = cell.querySelector('video');
          if (video && video.srcObject !== st.mediaStream) {
            video.srcObject = st.mediaStream;
          }
        }
      }
    }
  }

  for (const cam of cams) {
    if (!streamStates[cam.camera_id]) {
      const cell = VIDEO_GRID.querySelector(`.video-cell[data-cam-id="${cam.camera_id}"]`);
      const newVideo = cell ? cell.querySelector('video') : null;
      streamStates[cam.camera_id] = {
        pc: null,
        mediaStream: null,
        video: newVideo,
        cell: cell,
        streamPath: cam.stream_path,
        connecting: false,
        reconnectTimer: null,
        statsTimer: null,
        bitrate: 0,
        connected: false
      };
    }

    const st = streamStates[cam.camera_id];
    if (!cam.online) {
      if (st.pc || st.connecting) {
        cleanupStream(cam.camera_id);
      }
    } else {
      if (st.streamPath !== cam.stream_path) {
        cleanupStream(cam.camera_id);
        st.streamPath = cam.stream_path;
        tryConnectStream(cam.camera_id);
      } else if (!st.pc && !st.connecting && !st.reconnectTimer) {
        tryConnectStream(cam.camera_id);
      }
    }
  }
}

// ── Render: Health sidebar (Minimal) ─────────────────────────
function ensureSidebarCards(clusterEdges) {
  const existing = {};
  for (const card of SIDEBAR.querySelectorAll('.health-card')) {
    existing[card.dataset.nodeId] = card;
  }

  const neededIds = new Set(clusterEdges.map(e => e.node_id));

  for (const [nid, card] of Object.entries(existing)) {
    if (!neededIds.has(nid)) card.remove();
  }

  for (const edge of clusterEdges) {
    if (existing[edge.node_id]) {
      updateSidebarCard(existing[edge.node_id], edge);
    } else {
      createSidebarCard(edge);
    }
  }

  const cards = SIDEBAR.querySelectorAll('.health-card');
  const desired = clusterEdges.map(e => e.node_id);
  let idx = 0;
  for (const nid of desired) {
    for (const card of cards) {
      if (card.dataset.nodeId === nid) {
        const target = SIDEBAR.children[idx];
        if (card !== target) SIDEBAR.insertBefore(card, target);
        idx++;
        break;
      }
    }
  }
}

function createSidebarCard(edge) {
  const card = document.createElement('div');
  const h = edge.health || {};
  const status = !edge.online ? 'offline' : (h.qos_state === 'DEGRADED' || h.pipeline?.status === 'degraded' ? 'degraded' : 'online');

  card.dataset.nodeId = edge.node_id;

  const ip = edge.ip || h.advertise_ip || '';

  card.innerHTML = `
    <div class="header">
      <span class="status-indicator ${status}"></span>
      <span class="node-badge" title="Node ID: ${escAttr(edge.node_id)}">${escHtml(getNodeBadge(edge.node_id))}</span>
      <span class="node-id">${escHtml(edge.node_id)}</span>
      <button class="btn-copy-ip" data-ip="${escAttr(ip)}" title="Copy IP">📋</button>
      <span class="status-pill ${status}">${status.toUpperCase()}</span>
    </div>
    <div class="ip-row">
      <span class="ip-label">IP:</span>
      <span class="ip-value">${escHtml(ip || '—')}</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">GPU</span>
      <div class="metric-bar"><div class="bar-fill" data-metric="gpu" style="width:0%"></div></div>
      <span class="metric-value" data-metric="gpu-text">--</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">CPU</span>
      <div class="metric-bar"><div class="bar-fill" data-metric="cpu" style="width:0%"></div></div>
      <span class="metric-value" data-metric="cpu-text">--</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">RAM</span>
      <div class="metric-bar"><div class="bar-fill" data-metric="ram" style="width:0%"></div></div>
      <span class="metric-value" data-metric="ram-text">--</span>
    </div>
    <div class="stats-meta-row">
      <div class="meta-item">
        <span class="meta-label">Temp:</span>
        <span class="meta-value" data-metric="temp-text">--</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Load:</span>
        <span class="meta-value" data-metric="load-text">--</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">BW:</span>
        <span class="meta-value" data-metric="bw-text">--</span>
      </div>
    </div>
    <div class="active-cams-row" data-metric="cams-list"></div>
  `;

  const copyBtn = card.querySelector('.btn-copy-ip');
  if (copyBtn) {
    copyBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const ipToCopy = copyBtn.dataset.ip;
      if (ipToCopy && navigator.clipboard) {
        navigator.clipboard.writeText(ipToCopy);
        copyBtn.textContent = '✓';
        setTimeout(() => { copyBtn.textContent = '📋'; }, 1500);
      }
    });
  }

  SIDEBAR.appendChild(card);
  updateSidebarCard(card, edge);
}

function updateSidebarCard(card, edge) {
  const h = edge.health || {};
  const online = edge.online;
  const status = !online ? 'offline' : (h.qos_state === 'DEGRADED' || h.pipeline?.status === 'degraded' ? 'degraded' : 'online');

  card.className = `health-card ${status}`;

  const indicator = card.querySelector('.status-indicator');
  if (indicator) indicator.className = `status-indicator ${status}`;

  const statusPill = card.querySelector('.status-pill');
  if (statusPill) {
    statusPill.className = `status-pill ${status}`;
    statusPill.textContent = status.toUpperCase();
  }

  const ip = edge.ip || h.advertise_ip || '';
  const ipValue = card.querySelector('.ip-value');
  if (ipValue) ipValue.textContent = ip || '—';

  const copyBtn = card.querySelector('.btn-copy-ip');
  if (copyBtn) copyBtn.dataset.ip = ip;

  const source = h.source || '';

  const metrics = [
    { key: 'gpu', val: h.gpu_percent },
    { key: 'cpu', val: h.cpu_percent },
    { key: 'ram', val: h.ram_percent },
  ];

  for (const m of metrics) {
    const bar = card.querySelector(`[data-metric="${m.key}"]`);
    const text = card.querySelector(`[data-metric="${m.key}-text"]`);
    const isGpuOnPsutil = (m.key === 'gpu' && source === 'psutil');
    if (bar) {
      const pct = (isGpuOnPsutil || !online) ? 0 : Math.min(100, Math.max(0, m.val != null ? m.val : 0));
      bar.style.width = `${pct}%`;
      bar.className = 'bar-fill' + (pct > 80 ? ' crit' : pct > 60 ? ' warn' : '');
    }
    if (text) {
      if (!online) {
        text.textContent = '--';
      } else {
        text.textContent = (m.key === 'gpu') ? fmtGpuPct(m.val, source) : fmtPct(m.val);
      }
    }
  }

  const tempEl = card.querySelector('[data-metric="temp-text"]');
  if (tempEl) tempEl.textContent = online ? fmtGpuTemp(h.gpu_temp_c, source) : '--';

  const loadEl = card.querySelector('[data-metric="load-text"]');
  if (loadEl) loadEl.textContent = online && h.load_score != null ? Number(h.load_score).toFixed(1) : '--';

  const bwEl = card.querySelector('[data-metric="bw-text"]');
  if (bwEl) {
    if (!online || h.network_bandwidth == null || h.network_bandwidth === '') {
      bwEl.textContent = '—';
    } else {
      const n = parseFloat(h.network_bandwidth);
      bwEl.textContent = isNaN(n) ? '—' : `${n.toFixed(1)} Mbps`;
    }
  }

  const camsEl = card.querySelector('[data-metric="cams-list"]');
  if (camsEl) {
    const pipeline = h.pipeline || {};
    const activeCams = pipeline.active_cameras || [];
    if (online && activeCams.length > 0) {
      camsEl.innerHTML = activeCams.map(c => `<span class="cam-badge">${escHtml(c)}</span>`).join('');
    } else {
      camsEl.innerHTML = `<span class="cam-badge none">${online ? 'No active cameras' : 'Offline'}</span>`;
    }
  }
}

function updateSidebar() {
  const cluster = getCurrentCluster();
  if (!cluster || cluster.edges.length === 0) {
    SIDEBAR.innerHTML = '<div style="color:#555;text-align:center;padding:20px;font-size:12px;">No edges in this cluster</div>';
    return;
  }
  ensureSidebarCards(cluster.edges);

  const total = Object.keys(edges).length;
  const online = Object.values(edges).filter(e => e.online).length;
  EDGE_BADGE.textContent = `${total} edges`;
  EDGE_BADGE.className = `badge ${online > 0 ? 'online' : 'offline'}`;
}

// ── updateDashboard entry point ──────────────────────────────
function updateDashboard(data) {
  if (data) {
    if (data.nodes) {
      for (const [nid, node] of Object.entries(data.nodes)) {
        edges[nid] = Object.assign(edges[nid] || { node_id: nid, online: true, health: {} }, node);
      }
    } else if (data.edges) {
      const edgeList = Array.isArray(data.edges) ? data.edges : Object.values(data.edges);
      for (const edge of edgeList) {
        if (edge && edge.node_id) {
          edges[edge.node_id] = Object.assign(edges[edge.node_id] || { node_id: edge.node_id, online: true, health: {} }, edge);
        }
      }
    }
  }

  rebuildClusters();
  renderClusterNav();
  renderVideoGrid(data);
  updateSidebar();
}

// ── Render: Cluster nav ──────────────────────────────────────
function renderClusterNav() {
  const showNav = clusters.length > 1;
  PREV_BTN.style.display = showNav ? '' : 'none';
  NEXT_BTN.style.display = showNav ? '' : 'none';
  CLUSTER_DOTS.style.display = showNav ? '' : 'none';

  if (!showNav) {
    CLUSTER_TITLE.textContent = clusters.length === 1 ? clusters[0].id : 'Cluster';
    return;
  }

  CLUSTER_TITLE.textContent = clusters[currentClusterIdx].id;
  PREV_BTN.disabled = currentClusterIdx <= 0;
  NEXT_BTN.disabled = currentClusterIdx >= clusters.length - 1;

  CLUSTER_DOTS.innerHTML = clusters
    .map((c, i) => `<span class="dot ${i === currentClusterIdx ? 'active' : ''}" data-idx="${i}"></span>`)
    .join('');
}

function switchCluster(delta) {
  const newIdx = currentClusterIdx + delta;
  if (newIdx < 0 || newIdx >= clusters.length) return;

  for (const name of Object.keys(streamStates)) {
    cleanupStream(name);
    delete streamStates[name];
  }
  const oldVideos = VIDEO_GRID.querySelectorAll('video');
  for (const v of oldVideos) {
    v.srcObject = null;
  }

  currentClusterIdx = newIdx;
  renderClusterNav();
  renderVideoGrid();
  updateSidebar();
}

// ── WebSocket ────────────────────────────────────────────────
function connectWS() {
  if (reconnectTimer) clearTimeout(reconnectTimer);
  if (wsPingTimer) clearInterval(wsPingTimer);

  STATUS.textContent = 'Connecting...';
  STATUS.className = '';

  try {
    ws = new WebSocket(WS_URL);
  } catch(e) {
    STATUS.textContent = 'Connection failed. Retrying...';
    STATUS.className = 'error';
    reconnectTimer = setTimeout(connectWS, 3000);
    return;
  }

  ws.onopen = () => {
    STATUS.textContent = 'Connected';
    STATUS.className = 'online';
    wsPingTimer = setInterval(() => {
      try { ws.send(JSON.stringify({ action: 'ping' })); } catch(e) {}
    }, 30000);
  };

  ws.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      handleWSMessage(msg);
    } catch(e) {}
  };

  ws.onclose = () => {
    STATUS.textContent = 'Disconnected. Reconnecting...';
    STATUS.className = 'error';
    if (wsPingTimer) { clearInterval(wsPingTimer); wsPingTimer = null; }
    reconnectTimer = setTimeout(connectWS, 3000);
  };

  ws.onerror = () => {
    if (wsPingTimer) { clearInterval(wsPingTimer); wsPingTimer = null; }
  };
}

function handleWSMessage(msg) {
  switch (msg.type) {
    case 'init':
      for (const edge of msg.edges || []) {
        edges[edge.node_id] = edge;
      }
      updateDashboard({ edges: msg.edges });
      pollStreams();
      break;

    case 'edge_list':
      for (const edge of msg.edges || []) {
        edges[edge.node_id] = edge;
      }
      updateDashboard({ edges: msg.edges });
      break;

    case 'edge_registered':
      if (!edges[msg.node_id]) {
        edges[msg.node_id] = { node_id: msg.node_id, online: true, health: {} };
      }
      edges[msg.node_id].ip = msg.ip || edges[msg.node_id].ip;
      edges[msg.node_id].online = true;
      updateDashboard();
      pollStreams();
      break;

    case 'edge_offline':
      if (edges[msg.node_id]) {
        edges[msg.node_id].online = false;
      }
      updateDashboard();
      break;

    case 'edge_reconnected':
      if (edges[msg.node_id]) {
        edges[msg.node_id].ip = msg.ip || edges[msg.node_id].ip;
        edges[msg.node_id].online = true;
      }
      updateDashboard();
      break;

    case 'health_update':
      {
        if (!edges[msg.node_id]) {
          edges[msg.node_id] = { node_id: msg.node_id, online: true, health: {} };
        }
        const edge = edges[msg.node_id];
        edge.online = true;
        edge.last_heartbeat = msg.timestamp || Date.now() / 1000;
        const prevHealth = (typeof edge.health === 'object' && edge.health !== null) ? edge.health : {};
        const incomingHealth = { ...msg };
        delete incomingHealth.type;
        delete incomingHealth.node_id;

        const prevPipeline = (typeof prevHealth.pipeline === 'object' && prevHealth.pipeline !== null) ? prevHealth.pipeline : {};
        const incomingPipeline = (typeof incomingHealth.pipeline === 'object' && incomingHealth.pipeline !== null) ? incomingHealth.pipeline : null;

        const mergedPipeline = incomingPipeline ? {
          ...prevPipeline,
          ...incomingPipeline,
          fps_per_camera: { ...(prevPipeline.fps_per_camera || {}), ...(incomingPipeline.fps_per_camera || {}) },
          output_fps_per_camera: { ...(prevPipeline.output_fps_per_camera || {}), ...(incomingPipeline.output_fps_per_camera || {}) },
          input_fps_per_camera: { ...(prevPipeline.input_fps_per_camera || {}), ...(incomingPipeline.input_fps_per_camera || {}) },
          camera_features: { ...(prevPipeline.camera_features || {}), ...(incomingPipeline.camera_features || {}) },
          camera_workload: { ...(prevPipeline.camera_workload || {}), ...(incomingPipeline.camera_workload || {}) },
          camera_configs: { ...(prevPipeline.camera_configs || {}), ...(incomingPipeline.camera_configs || {}) },
          active_cameras: incomingPipeline.active_cameras !== undefined ? incomingPipeline.active_cameras : prevPipeline.active_cameras,
        } : prevPipeline;

        edge.health = {
          ...prevHealth,
          ...incomingHealth,
          pipeline: mergedPipeline,
        };
        updateDashboard();
      }
      break;
  }
}

// ── Stream polling ───────────────────────────────────────────
async function pollStreams() {
  try {
    const resp = await fetch(CONFIG.MEDIAMTX_API || '/api/streams');
    if (!resp.ok) return;
    const data = await resp.json();
    const items = data.items || [];
    mediaMtxStreamNames = items
      .filter(p => p.source && p.source.type === 'rtspSession')
      .map(p => p.name);
  } catch(e) {}
}

// ── Authoritative camera projection ────────────────────────
// Server collapses per-node active_cameras into one row per camera_id. Pull it
// so the dashboard never unions duplicate per-node reports.
async function refreshAuthoritativeCameras() {
  try {
    const resp = await fetch('/api/cameras');
    if (!resp.ok) return;
    const rows = await resp.json();
    authoritativeCameras.clear();
    for (const row of (rows || [])) {
      authoritativeCameras.set(row.camera_id, row);
    }
    updateDashboard();
  } catch(e) {}
}

// ── Init ─────────────────────────────────────────────────────
function init() {
  PREV_BTN.addEventListener('click', () => switchCluster(-1));
  NEXT_BTN.addEventListener('click', () => switchCluster(1));
  CLUSTER_DOTS.addEventListener('click', (e) => {
    const dot = e.target.closest('.dot');
    if (dot && dot.dataset.idx != null) {
      const idx = parseInt(dot.dataset.idx);
      if (idx !== currentClusterIdx) switchCluster(idx - currentClusterIdx);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') MODAL.classList.remove('open');
  });

  connectWS();
  streamPollTimer = setInterval(pollStreams, 5000);
  refreshAuthoritativeCameras();
  cameraPollTimer = setInterval(refreshAuthoritativeCameras, 5000);
}

// Expose globally for testing/callbacks
window.buildCameraList = buildCameraList;
window.updateDashboard = updateDashboard;

init();

})();
</script>
