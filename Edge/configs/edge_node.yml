# ============================================================
# edge_node.yml — P2P Orchestration Parameters only
#
# All scalar settings (node_id, fps, max_streams, signaling,
# health interval, etc.) live in Edge/.env — not here.
# This file holds only the structured P2P tuning that cannot
# be expressed as flat key=value pairs.
# ============================================================

p2p:
  overload_threshold: 55.0      # load_score at or above this triggers RFO (L2 full-stream migration)
                                     # peak under Base + Bonus load_score ≈ 55
  overload_duration_s: 3.0     # platoons last 3-4s; 3s confirms overload while filtering 1-2s noise
                                     # quick reaction (5s) while filtering instant 1s telemetry jitter
  cooldown_s: 6.0              # per-camera cooldown between migrations
                                    # prevents ping-pong while allowing rebalancing
  migration_timeout_s: 15.0    # wait for ADD ack before rollback (raised for a real 15-20s signal cycle;
                                # must exceed add_ack_timeout_s to absorb handshakes that span one cycle)
  add_ack_timeout_s: 12.0     # max wait on receiver for ADD stream to reach PLAYING (must be < migration_timeout_s;
                                # bounded by 15-20s signal cycle so handshakes can complete within one cycle)
  heartbeat_timeout_s: 10.0     # Edge declares a peer OFFLINE after this silence (Edge-local peer timeout; Server watchdog is separate at HEARTBEAT_TIMEOUT=30.0)
  failover_grace_s: 10.0        # grace period between heartbeat timeout and offline declaration; allows Zenoh mesh reconvergence after container restart without triggering false-offline cascades
  failover_convergence_grace_s: 15.0 # suppress mutual false-offline cascade during failover convergence
  rescue_claim_window_s: 1.0    # claim window to collect peer rescue claims before ADD
  rescue_claim_lease_s: 15.0   # duration during which an active peer claim suppresses local ADD
  failover_retry_interval_s: 30.0 # re-arm interval (s): retry a failed failover while the peer stays dead instead of latching until its heartbeat revives
  recovery_wait_s: 60.0        # wait 60s in recovery before re-adding locally-owned cameras
  vote_window_s: 5.0            # proposal collection duration
  failover_jitter_max_s: 5.0    # random delay before failover ADD (race prevention)
  reclaim_margin: 20.0         # reclaim only when load < (overload_threshold - reclaim_margin)
                                   # 55 - 20 = 35; enables reclaim once score drops below 35
                                   # calibrated 2026-09-18 vs live platoon sums B=14.8 C=11.1 @25-30fps
  reclaim_stable_s: 5.0        # load must stay below reclaim threshold this long before
                                # reclaiming — 5s confirms genuine recovery
  reclaim_stability_s: 6.0     # post-reclaim observation window (seconds): a just-returned
                                # camera cannot be offloaded during this window; prevents oscillation
                                # from transient FPS spikes during stream warm-up.
  bounce_max: 3                # max migrations per camera in bounce_window_s before L1 exclusion
  bounce_window_s: 60.0        # bounce observation window (seconds)
  zombie_timeout_count: 3      # consecutive migration timeouts before excluding peer from selection

  # Offload tiers (ADR-0002, canonical governance naming; see
  # verify_offload_contract.py for the authoritative 0/1/2 enum):
  #   L0 — local full DeepStream analytics (default; offload_level==0)
  #   L1 — plate-crop offload for off-pipeline LPR (offload_level==1)
  #   L2 — full-stream RTSP migration via the RFO/lease path (offload_level==2;
  #        tracked by the lease/RFO machinery, not a runtime-table write)
  # The vehicle-crop tier (source offload_level==3) was retired — no trigger,
  # no session publisher, receiver drops unsessioned vehicle crops.
  # The single L1 transfer decision is gated by an offload-aware stream-pressure
  # signal (see membership._compute_stream_pressure). ADR-0001: stream-pressure is
  # workload/resource pressure (GPU/CPU/RAM saturation + per-camera demand +
  # source starvation) — NOT FPS deficit. Fail closed only when telemetry invalid.
  target_fps: 25.0             # decode/inference target FPS (bid scoring / eps tiers only; NOT a migration gate)
  workload_saturation_point: 16.0  # PROVISIONAL/INFERRED per-camera demand saturation (sum n_track+n_plate); mirrors load_score.workload_policy.w_high. Tune vs real telemetry.
                                    # calibrated 2026-09-18 rev2 normal-band 40-50, signal-cycle 15-20s
  stream_pressure_threshold: 0.30  # min [0,1] workload/resource pressure to authorize L1 (fail closed below this)
  ladder_l1_hold_s: 12.0        # observation window (seconds) holding L1 before considering L2 (mandatory ladder)
                                  # calibrated 2026-09-18 rev4: 8s hold before L2 (11s total entry path with 3s onset)
  overload_clear_threshold: 50.0  # clear overload only below this; deadband 50-55 vs onset 55 so single-tick dips cannot reset the hold

  # Static node-to-camera ownership mapping (for cluster topology & failover isolation)
  node_camera_map:
    jetson_A: ["cam_01", "cam_02"]
    jetson_B: ["cam_03", "cam_04"]
    jetson_C: ["cam_05", "cam_06"]

  # Thermal admission gate for peer selection
# Refuses to offload to a peer whose gpu_temp_c suggests unsafe conditions.
# Unknown / missing values: behaviour controlled by reject_invalid + invalid_policy.
  thermal:
    admission_enabled: true  # set false to disable the gate entirely (audit mode only)
    max_gpu_temp_c: 85.0     # peer gpu_temp_c above this → reject as offload target
    reject_invalid: true     # when true, peers with None/missing gpu_temp_c are rejected
    # invalid_policy: what to do when temperature is known missing/zero
    # "conservative" (default) → reject if reject_invalid is also true
    # "permissive"     → accept anyway (override reject_invalid for unknown data)
    invalid_policy: conservative

  # epsilon-Constraint tiers (Pareto optimization)
  eps_fps_strict: 25.0          # Tier 0 — strict FPS floor
  eps_fps_tier1: 21.0           # Tier 1 relaxation
  eps_fps_tier2: 18.0           # Tier 2 relaxation
  eps_network_ms_strict: 30.0   # Tier 0 — RTSP RTT ceiling
  eps_network_ms_tier1: 60.0    # Tier 1 relaxation
  eps_streams_max: 4            # Hard capacity ceiling

  # Multi-objective bid scoring weights for RFO F(x)
  bid_weights:
    w_load: 0.50   # current load pressure (0-100 normalized)
    w_fps: 0.25    # predicted FPS degradation relative to target_fps
    w_rtt: 0.15    # network latency relative to eps_net_ms
    w_therm: 0.10  # thermal headroom consumption above onset_c

  # Offload policy: "p2p_pareto" (default), "no_offload", "round_robin",
  # "least_load_greedy", "centralized_greedy" (for baseline comparison)
  policy: "p2p_pareto"

  # FPS prediction model — calibrate offline per Jetson model
  # key = number of streams AFTER accepting the new camera
  fps_model:
    1: 30.0
    2: 25.0
    3: 20.5
    4: 15.5

  # ---------------------------------------------------------------------------
  # Offload level enum — canonical governance tiers (ADR-0002; see
  # verify_offload_contract.py for the authoritative 0/1/2 runtime enum):
  #   offload_level: 0 = L0 local full analytics (default)
  #                 1 = L1 plate-crop offload (source offload_level==1; stream stays local)
  #                 2 = L2 full-stream RTSP migration via the RFO/lease path
  #                     (the only decode/tracking relief; tracked by lease/RFO
  #                     machinery, not a runtime-table write)
  # The vehicle-crop tier (source offload_level==3) is RETIRED — no trigger, no
  # session publisher, receiver drops unsessioned vehicle crops.
  # NOTE: the scalar below is legacy wire residue kept for compatibility; it is
  # NOT the runtime offload_level. Runtime is 0/1/2 per the contract verifier.
  # ---------------------------------------------------------------------------
  offload_level: 3

  offload_release_dwell_s: 5.0  # node must stay below L2/L1 release threshold this long before clearing offload
  offload_session_idle_s: 10.0   # receiver session TTL in seconds

  # TensorRT engine paths used by the offload receiver (Level 1 + 2)
  lpr_engine_path: "models/lpr.engine"
  lpd_engine_path: "models/lpd.engine"

  # ---------------------------------------------------------------------------
  # LPR offload ladder (L1 plate-crop offload trigger/reclaim governance).
  # Read FLAT from p2p_cfg by offload.py / ownership.py / membership.py via
  # self._cfg.get(...) — do NOT nest these under a sub-dict or the code's
  # fallback defaults would silently win again (the bug this block fixes).
  # LPR ratio = LPR-queue-lag fraction driving the L1 plate-crop offload path.
  # ---------------------------------------------------------------------------
  delta_l_stream: 20.0              # stream-level delta reference; L1 plate-crop admits below threshold directly
  lpr_offload_up_threshold: 0.20    # LPR queue ratio to trigger L1 plate-crop offload
  lpr_offload_down_threshold: 0.08  # LPR queue ratio to release L1 plate-crop offload
  lpr_offload_up_depth: 5           # pending crop backlog to trigger L1 offload
  lpr_offload_down_depth: 1         # pending crop backlog threshold to reclaim L1 offload
  lpr_offload_sustain_s: 1.5       # seconds LPR ratio must sustain before trigger
  lpr_offload_reclaim_cooldown_s: 5.0  # cooldown after LPR-triggered reclaim
  lpr_offload_cooldown_s: 6.0       # cooldown after LPR offload release
  offload_queue_full_release_count: 3  # consecutive full-queue events before release

  # ---------------------------------------------------------------------------
  # Lease/RFO ownership reclaim governance (ownership.py / membership.py).
  # Read FLAT from p2p_cfg — same nesting caveat as the LPR ladder above.
  # ---------------------------------------------------------------------------
  reclaim_retry_s: 5.0          # base retry interval for ownership reclaim
  reclaim_max_backoff_s: 30.0   # max backoff for reclaim retries
  reclaim_max_retries: 3        # max reclaim attempts before giving up
  remove_ack_timeout_s: 10.0    # timeout waiting for REMOVE ack
  transition_settle_s: 5.0      # settle time after ownership transition

  # ---------------------------------------------------------------------------
  # Rescue source-probe backoff & liveness (rescue.py RescueProbeBackoff).
  # Read FLAT from p2p_cfg — same nesting caveat as the LPR ladder above.
  # ---------------------------------------------------------------------------
  rescue_source_probe_backoff_base_s: 5.0   # base backoff for rescue source probe
  rescue_source_probe_backoff_max_s: 60.0   # max backoff for rescue source probe
  rescue_source_probe_max_attempts: 12      # max probe attempts before abort
  rescue_source_liveness_ttl_s: 30.0        # TTL for rescue source liveness cache

# ---------------------------------------------------------------------------
# Load score — `legacy` is the ACTIVE default mode (workload/FPS fallback);
# the Completion-Primary (Service Mode) form below applies ONLY if
# load_score.mode (line ~151) is set to "service". (mode default switched to
# legacy by commit d46fe87.)
#
# Form (mode: service):
#   instant_completion = d_fin / (d_fin + d_miss) over evaluation interval
#   service_ema = ema_alpha * instant_completion + (1 - ema_alpha) * service_ema
#   service_score = piecewise linear on [0, 100] from target (0.95 -> 0) to floor (0.50 -> 100)
#   load_score = max(service_score, fps_emergency_floor [80 if FPS < 12], hw_fuse_floor [80 if CPU/RAM >= 90])
# ---------------------------------------------------------------------------
load_score:
  mode: legacy             # service (unified: completion-deficit ∨ workload-pressure ∨ fps/hw floors) | legacy (workload/FPS fallback)
  service:
    target: 0.95
    floor: 0.50
    ema_alpha: 0.30
    ema_stale_s: 30.0
    min_track_frames: 5
    fps_emergency: 12.0
  hw_fuse_threshold: 90.0
  hw_fuse_score_floor: 80.0

  # Workload-primary demand/resource/service policy (ADR-0001).
  # FPS is an EMERGENCY SAFETY FUSE ONLY (fps_emergency floor on collapse) —
  # never a primary trigger or de-escalation veto.
  # NOTE: w_demand / w_resource / w_service / fps_emergency are PROVISIONAL /
  # INFERRED — weights are reasonable defaults, NOT measured constants. Tune
  # against real Jetson telemetry before asserting any numeric value (W_sat
  # remains provisional per ADR-0001).
  workload_policy:
    enabled: true
    w_low: 6.0
    # w_high: provisional saturation point (INFERRED) for the demand axis.
    # Aligned with load_score.workload.capacity (40) and p2p.workload_saturation_point
    # so NORMAL calibrated demand can reach the overload threshold WITHOUT requiring
    # FPS. W_sat remains provisional per ADR-0001 — tune against real telemetry.
    w_high: 16.0
    # calibrated 2026-09-18 rev2 normal-band 40-50, signal-cycle 15-20s
    alpha_ema: 0.33
    # Stream concurrency axis: convex knee on EMC LPDDR5 bus.
    stream_knee: 4.0
    # calibrated 2026-09-18 vs live platoon sums B=14.8 C=11.1 @25-30fps
    stream_exp: 2.0
    # Resource axis: CPU/RAM saturation safety margin (rho_r = 0 below this).
    u_safe: 0.60
    # Service axis: bounded completion-deficit vs achievable floor (rho_v_max cap).
    svc_target: 0.95
    svc_floor: 0.50
    rho_v_max: 1.0
    # Emergency FPS safety fuse: floor the score only when FPS collapses below this.
    fps_emergency: 12.0

  workload:
    enabled: true
    capacity: 40.0
    max_bonus: 15.0

  thermal:
    enabled: true
    onset_c: 70.0
    critical_c: 85.0
    max_bonus: 5.0

  # recv: (removed) crop-receive bonus was dead scoring — crop offload is a
  # non-genuine GPU offload (ADR-0001); no active scoring used it.

  trend:
    enabled: true
    window_s: 3.0
    max_decline_fps_per_s: 2.0
    max_bonus: 5.0

  proactive_bonus:
    max_bonus: 10.0

# ---------------------------------------------------------------------------
# Proactive load model — Vehicle-Driven Proactive Load Profiling
#
# Coefficients (w_base / alpha1 / alpha2 / beta / gamma) below are populated
# manually on the target Jetson; the historical offline fitting/collection
# tooling has been removed from the deploy tree.
#
# Formula (L_proactive normalised to [0,1]):
#   L = (W_base + Σ_cam[α₁·N_track + α₂·N_track² + β·N_plate + γ·S]) / 100
#   H = max(R_GPU, R_CPU, R_RAM) × Θ_thermal   (Θ ramps 1.0→max_mult over t_low→t_high)
#   U = 1 - (1 - L̂_avg)(1 - Ĥ_avg)             noisy-OR; both cycle-averaged
#
# Risk trigger: U ≥ risk_threshold → overload onset (replaces load_score threshold
#               when enabled, zero behaviour change when disabled).
# ---------------------------------------------------------------------------
proactive:
  enabled: false          # set true only after populating the coefficients below
  shadow_mode: true       # emit risk_index telemetry while keeping all decisions
                          # strictly passive/reactive — audit-only side-channel

  # W_base: idle GPU load with an active Zenoh session but zero video sources.
  w_base: 0.0            # placeholder — replace with measured value

  # Regression coefficients (α₂ = 0.0 if linear model chosen by held-out RMSE)
  alpha1: 0.0             # N_track linear coefficient   — fill after Phase 1
  alpha2: 0.0             # N_track² quadratic coeff     — 0.0 if linear wins
  beta:   0.0             # N_plate coefficient           — fill after Phase 1
  gamma:  0.0             # stationary_fraction coeff     — fill after Phase 1

  # Cycle-aware smoothing window (≈ one full traffic-light cycle)
  cycle_window_s: 6.0

  # Offload trigger threshold on the smoothed risk index U
  risk_threshold: 0.85    # U ≥ this → overload (replaces overload_threshold when enabled)

  # Hardware safety fuse: U ≥ this → force Level-1 migration regardless of L
  hard_fuse_threshold: 0.95

  # Θ_thermal smooth ramp (replaces discrete omega thermal preset)
  theta_thermal:
    t_low:    75.0         # °C — ramp starts here (multiplier = 1.0)
    t_high:   90.0         # °C — ramp ends here   (multiplier = max_mult)
    max_mult: 1.25         # ≈ Jetson thermal throttle factor (~20–25% clock cut)

  # Deep-learning predictor (used when LOAD_MODEL=dl)
  # Training contract (offline trainer no longer ships in this tree):
  #   source_interval_s=0.5  → raw pipeline writes 2 rows/s
  #   sample_interval_s=1.0  → model trained at 1.0s cadence (matches HEALTH_INTERVAL)
  #   history=5               → 5 rows × 1.0s = 5 s lookback
  #   horizons=[6.0, 10.0]   → ONNX outputs [FPS@t+6s, FPS@t+10s]
  #   horizon_index=0        → use first output (t+6s)
  #
  # Feature vector (10 features):
  #   [n_active, n_track, n_plate, stationary, fps_avg, gpu, cpu, ram, gpu_temp, offload_rate]
  dl_model:
    model_path:        ""        # e.g. "models/future_fps_predictor.onnx" — train artifact not yet produced
    window_k:           5        # deployment-side history length (must match trainer's --history)
    sample_interval_s:  1.0      # cadence in seconds (must match HEALTH_INTERVAL + trainer's --sample-interval)
    horizons_s:         [6, 10]  # forecast horizons (must match trainer's --horizons)
    horizon_index:      0        # which horizon to use: 0 = t+6s, 1 = t+10s
